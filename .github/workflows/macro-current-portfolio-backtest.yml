name: MACRO Current Portfolio Backtest

on:
  push:
    branches: [macro-backtest-v08]
    paths:
      - 'macro-backtest/backtest.py'
      - 'macro-backtest/defense_mix_test.py'
      - 'macro-backtest/current_portfolio_backtest.py'
      - 'macro-backtest/persist_results.py'
      - '.github/workflows/macro-current-portfolio-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-backtest-v08-results-writer
  queue: max
  cancel-in-progress: false

jobs:
  current-portfolio-backtest:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref_type == 'branch' &&
      (github.ref_name == 'macro-backtest-v08' || github.ref_name == 'macro-backtest-v08-repair')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r macro-backtest/requirements.txt
      - name: Run current portfolio backtest
        run: python macro-backtest/current_portfolio_backtest.py
      - name: Persist current portfolio results
        run: >-
          python macro-backtest/persist_results.py macro-backtest/results-current-portfolio
          "Run current canonical portfolio backtest"
