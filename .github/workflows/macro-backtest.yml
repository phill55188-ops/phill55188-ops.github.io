name: MACRO v08 Backtest

on:
  push:
    branches: [macro-backtest-v08]
    paths:
      - 'macro-backtest/**'
      - '.github/workflows/macro-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macro-backtest-v08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r macro-backtest/requirements.txt
      - name: Run test
        run: python macro-backtest/backtest.py
      - name: Save results to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-backtest/results
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Run MACRO v08 backtest"
            git push origin HEAD:macro-backtest-v08
          fi
