name: MACRO Orchestration Split Test

on:
  push:
    branches: [macro-backtest-v08]
    paths:
      - 'macro-backtest/orchestration_split_test.py'
      - '.github/workflows/macro-orchestration-split-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orchestration-split-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: macro-backtest-v08
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r macro-backtest/requirements.txt
      - name: Run orchestration split comparison
        run: python macro-backtest/orchestration_split_test.py
      - name: Save orchestration comparison results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-backtest/results-orchestration
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Run orchestration split comparison"
            git pull --rebase origin macro-backtest-v08
            git push origin HEAD:macro-backtest-v08
          fi
