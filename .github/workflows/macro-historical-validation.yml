name: MACRO Historical Validation

on:
  push:
    branches: [macro-backtest-v08]
    paths:
      - 'macro-backtest/historical_validation.py'
      - 'macro-backtest/march_anchor_benchmark.py'
      - 'macro-backtest/configs/2026-03-27_pre_bull_run_anchor.json'
      - 'macro-backtest/persist_results.py'
      - '.github/workflows/macro-historical-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-backtest-v08-results-writer
  queue: max
  cancel-in-progress: false

jobs:
  historical-validation:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.ref_type == 'branch' &&
      (github.ref_name == 'macro-backtest-v08' || github.ref_name == 'macro-backtest-v08-repair')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r macro-backtest/requirements.txt
      - name: Run harness self-test
        run: python macro-backtest/historical_validation.py --self-test
      - name: Run March 2026 frozen-thesis validation
        run: |
          python macro-backtest/historical_validation.py \
            --config macro-backtest/configs/2026-03-27_pre_bull_run_anchor.json \
            --output macro-backtest/results-historical-validation/march_2026_anchor_results.json
      - name: Run March 2026 benchmark comparison
        run: python macro-backtest/march_anchor_benchmark.py
      - name: Persist historical validation results
        run: >-
          python macro-backtest/persist_results.py macro-backtest/results-historical-validation
          "Run March 2026 frozen-thesis validation"
