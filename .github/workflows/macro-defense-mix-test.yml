name: MACRO Defense Mix Test

on:
  push:
    branches: [macro-backtest-v08]
    paths:
      - 'macro-backtest/backtest.py'
      - 'macro-backtest/defense_mix_test.py'
      - 'macro-backtest/fractional_diversifier_test.py'
      - '.github/workflows/macro-defense-mix-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  defense-mix-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r macro-backtest/requirements.txt 'exchange-calendars>=4,<5'
      - name: Run defensive mix comparison
        run: >-
          python macro-backtest/acceptance/acceptance_runtime.py capture
          --root .
          --bundle macro-backtest/results-provenance/${{ github.run_id }}-${{ github.run_attempt }}/defense
          --harness macro-backtest/defense_mix_test.py
          --output macro-backtest/results-defense-mix
      - name: Run fractionable diversifier comparison
        run: python macro-backtest/fractional_diversifier_test.py
      - name: Save defensive mix results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add macro-backtest/results-defense-mix macro-backtest/results-provenance/${{ github.run_id }}-${{ github.run_attempt }}/defense
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Run defensive mix comparison"
            git pull --rebase origin macro-backtest-v08
            git push origin HEAD:macro-backtest-v08
          fi
      - name: Seal immutable captured evidence (not acceptance)
        env:
          CAPTURE_KIND: defense
        run: |
          python - <<'PYSEAL'
          import json, os, pathlib, shutil, subprocess
          bundle_path=f"macro-backtest/results-provenance/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}/{os.environ['CAPTURE_KIND']}"
          result_commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          export=pathlib.Path(os.environ['RUNNER_TEMP'])/'macro-capture'
          export.mkdir()
          shutil.copytree(bundle_path,export/'bundle')
          (export/'seal.json').write_text(json.dumps({'result_commit':result_commit,'bundle_path':bundle_path,'kind':os.environ['CAPTURE_KIND']},sort_keys=True)+'\n')
          PYSEAL
      - name: Retain captured evidence for independent completed-run gate
        uses: actions/upload-artifact@v4
        with:
          name: macro-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/macro-capture/
          if-no-files-found: error
          retention-days: 30
